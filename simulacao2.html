<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simulação</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(0, 0, 0);
        }
        canvas {
            box-sizing: border-box;
        }
        section {
            position: absolute;
            z-index: 10;
        }
        button {
            position: relative;
            top: 10px;
            left: 10px;
            margin-right: 10px;
        }
        input {
            position: relative;
            top: 10px;
            left: 10px;
            margin-right: 10px;
            width: 220px;
        }
    </style>
</head>
<body>
    <section>
        <button id="stop">parar</button>
        <button id="reset">resetar</button>
        <input type="number" id="quantidade" placeholder="Insira a quantidade de elementos">
        <button id="adicionar">adicionar</button>
    </section>
    <canvas id="canvas"></canvas>
    <script>
        const stopButton = document.getElementById('stop');
        const resetButton = document.getElementById('reset');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const adicionarButton = document.getElementById('adicionar');
        const quantidadeInput = document.getElementById('quantidade');
        adicionarButton.addEventListener('click', () => {
            const quantidade = parseInt(quantidadeInput.value);
            for (let i = 0; i < quantidade; i++) {
                elements.push({
                    id: `elemento${elements.length + 1}`,
                    color: `rgb(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)})`,
                    center: { x: Math.random() * (canvas.width - 0) + 0, y: Math.random() * (canvas.height - 0) + 0 },
                    direcao: Math.floor(Math.random() * 4),
                    raio: 20
                });
            }
            const interval = setInterval(draw, 1000 / 60);
        });
        ctx.canvas.width  = window.innerWidth;
        ctx.canvas.height = window.innerHeight;
        let elements = [];
        function interagir(element1, element2) {
            let dado1 = Math.floor(Math.random() * 20) + 1;
            let dado2 = Math.floor(Math.random() * 20) + 1;
            if (dado1 > dado2) {
                console.log(element1.id, 'venceu a interação contra', element2.id);
                elements = elements.filter(e => e !== element2);
            } else if (dado2 > dado1) {
                console.log(element2.id, 'venceu a interação contra', element1.id);
                elements = elements.filter(e => e !== element1);
            } else {
                console.log('empate entre', element1.id, 'e', element2.id);
            }
        }
        function draw(apenasAdicionar) {
            const basespeed = 2.5
            if (!apenasAdicionar) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            elements.forEach(element => {
                ctx.fillStyle = element.color;
                ctx.strokeStyle = "white";
                ctx.beginPath();
                ctx.arc(element.center.x, element.center.y, element.raio, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.closePath();
                ctx.lineWidth = 5;
                switch(element.direcao) {
                    case 0:
                        element.center.x -= basespeed;
                        element.center.y -= basespeed;
                        break;
                    case 1:
                        element.center.x += basespeed;
                        element.center.y -= basespeed;
                        break;
                    case 2:
                        element.center.y += basespeed;
                        element.center.x -= basespeed;
                        break;
                    case 3:
                        element.center.y += basespeed;
                        element.center.x += basespeed;
                        break;
                }
                if (element.center.x > canvas.width - element.raio) {
                    if (element.direcao === 1) {
                        element.direcao = 0;
                    } else if (element.direcao === 3) {
                        element.direcao = 2;
                    }
                }
                if (element.center.x < element.raio) {
                    if (element.direcao === 0) {
                        element.direcao = 1;
                    } else if (element.direcao === 2) {
                        element.direcao = 3;
                    }
                }
                if (element.center.y > canvas.height - element.raio) {
                    if (element.direcao === 2) {
                        element.direcao = 0;
                    } else if (element.direcao === 3) {
                        element.direcao = 1;
                    }
                }
                if (element.center.y < element.raio) {
                    if (element.direcao === 0) {
                        element.direcao = 2;
                    } else if (element.direcao === 1) {
                        element.direcao = 3;
                    }
                }
                let elementomaisproximo;
                let elementosproximos = [];
                for (let j = 0; j < elements.length; j++) {
                    let elementopossivel = elements[j];
                    if (elementopossivel === element) continue;
                    const dx = element.center.x - elementopossivel.center.x;
                    const dy = element.center.y - elementopossivel.center.y;
                    elementosproximos.push({x: dx, y: dy, elemento: elementopossivel});
                    if (elementosproximos.length === elements.length - 1) {
                        for (let k = 0; k <= elements.length - 1; k++) {
                            if (elements[k] === element) continue;
                            const distancia = Math.sqrt((element.center.x - elements[k].center.x) ** 2 + (element.center.y - elements[k].center.y) ** 2);
                            if (distancia <= element.raio + elements[k].raio) {
                                interagir(element, elements[k]);
                            }
                        }
                    }
                }
            });
            
        }
        stopButton.addEventListener('click', () => {
            clearInterval(interval);
        });
        resetButton.addEventListener('click', () => {
            elements = [];
        });
        if (elements.length === 1) {
            clearInterval(interval);
            console.log('Simulação encerrada. Elemento vencedor:', elements[0].id);
        }
    </script>
</body>
</html>

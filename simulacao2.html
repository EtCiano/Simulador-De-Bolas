<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simulação</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(0, 0, 0);
        }
        canvas {
            box-sizing: border-box;
        }
        section {
            position: absolute;
            z-index: 10;
        }
        button {
            position: relative;
            top: 10px;
            left: 10px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <section>
        <button id="stop">parar</button>
        <button id="reset">resetar</button>
    </section>
    <canvas id="canvas"></canvas>
    <script>
        const stopButton = document.getElementById('stop');
        const resetButton = document.getElementById('reset');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.canvas.width  = window.innerWidth;
        ctx.canvas.height = window.innerHeight;
        const inicialx1 = Math.random() * (canvas.width - 0) + 0;
        const inicialy1 = Math.random() * (canvas.height - 0) + 0;
        const inicialx2 = Math.random() * (canvas.width - 0) + 0;
        const inicialy2 = Math.random() * (canvas.height - 0) + 0;
        let elements = [
            {
                vertices: [
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1},
                    { x: inicialx1, y: inicialy1}
                ],
                color: 'rgba(255, 0, 0, 0.5)',
                centercalcx: [],
                centercalcy: [],
                center: { x: 0, y: 0 }
                
             },
             {
                vertices: [
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2},
                    { x: inicialx2, y: inicialy2}
                ],
                color: 'rgba(0, 0, 255, 0.5)',
                centercalcx: [],
                centercalcy: [],
                center: { x: 0, y: 0 }
             }
        ];
        function draw() {
            const basespeed = 5
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            elements.forEach(element => {
                ctx.fillStyle = element.color;
                ctx.strokeStyle = "white";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(element.vertices[0].x, element.vertices[0].y);
                for (let i = 1; i < element.vertices.length; i++) {
                    ctx.lineTo(element.vertices[i].x, element.vertices[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                element.vertices.forEach(vertex => {
                    ctx.beginPath();
                    ctx.arc(vertex.x, vertex.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = "white";
                    ctx.fill();
                    ctx.closePath();
                    if (vertex.x < element.center.x) {
                        vertex.x -= Math.random() * (basespeed - -4) + -4;
                    } else {
                        vertex.x += Math.random() * (basespeed - -4) + -4;
                    }
                    if (vertex.y < element.center.y) {
                        vertex.y -= Math.random() * (basespeed - -4) + -4;
                    } else {
                        vertex.y += Math.random() * (basespeed - -4) + -4;
                    }
                    if (vertex.x >= 0 || vertex.x <= canvas.width) {
                        vertex.x = vertex.x;
                    }
                    if (vertex.y >= 0 || vertex.y <= canvas.height) {
                        vertex.y = vertex.y;
                    }
                    element.centercalcx.push(vertex.x);
                    element.centercalcy.push(vertex.y);
                });
                element.center.x = element.centercalcx.reduce((a, b) => a + b, 0) / element.centercalcx.length;
                element.center.y = element.centercalcy.reduce((a, b) => a + b, 0) / element.centercalcy.length;
                element.centercalcx = [];
                element.centercalcy = [];
                ctx.beginPath();
                ctx.arc(element.center.x, element.center.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = "yellow";
                ctx.fill();
                ctx.closePath();
            });
        }
        const interval = setInterval(draw, 1000 / 60);
        stopButton.addEventListener('click', () => {
            clearInterval(interval);
        });
        resetButton.addEventListener('click', () => {
            elements.forEach(element => {
                const inicialx = Math.random() * (canvas.width - 0) + 0;
                const inicialy = Math.random() * (canvas.height - 0) + 0;
                element.vertices.forEach(vertex => {
                    vertex.x = inicialx;
                    vertex.y = inicialy;
                });
            });
        });
    </script>
</body>
</html>

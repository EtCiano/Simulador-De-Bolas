<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: Arial, sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .controles {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .panel {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 0;
            background-color: white;
            color: black;
            transition: width 0.3s ease;
            overflow: hidden;
            z-index: 10;
            padding: 0;
        }

        .panel.open {
            width: 350px;
            padding: 20px;
            border-left: 2px solid black;
        }

        button, #quantidade{
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: white;
            color: black;
            cursor: pointer;
            font-size: 14px;
        }
        h4 {
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #f0f0f0;
        }

        input[type="number"] {
            width: 150px;
        }

        .rules-content, .config-content {
            margin-top: 20px;
        }

        .rules-content h3, .config-content h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        .rules-content ul {
            list-style: none;
            margin-bottom: 20px;
        }

        .rules-content li {
            margin-bottom: 8px;
            padding-left: 10px;
        }

        .additional-rules {
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }

        .rule-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .rule-option input[type="checkbox"] {
            margin-right: 10px;
        }

        .rule-option label {
            font-size: 13px;
            line-height: 1.3;
        }
        .fechar_panel {
            position: absolute;
            top: 10px;
            right: 10px;
            color: rgb(0, 0, 0);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-weight: bold;
            text-align: center;
            font-size: 20px;
            line-height: 25px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .configs {
            width: 100px;
            margin-left: 10px;
            border: 2px solid #acacac;
            border-radius: 5px;
            padding: 8px 12px;
            background-color: white;
            color: black;
            cursor: pointer;
            font-size: 14px;
        }
        .configs-individual {
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .configs-individual input {
            width: 150px;
        }
        #stop {
            width: 85px;
        }
        .subtitulo {
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
            color: #555;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controles">
        <button id="stop">Pausar</button>
        <button id="reset">Resetar</button>
        <input type="number" id="quantidade" placeholder="Quantidade" min="1" value="5">
        <button id="adicionar">Executar</button>
        <button id="regras">Regras</button>
        <button id="config">Configurações</button>
    </div>

    <div id="div_regras" class="panel">
        <button id="fechar_panel" class="fechar_panel">x</button>
        <div class="rules-content">
            <h3>Regras da Simulação</h3>
            <ul>
                <li>• Cada elemento se move em direção aleatória</li>
                <li>• Elementos colidem e se comem aleatoriamente</li>
                <li>• Em empates, ambos permanecem</li>
                <li>• Simulação continua até restar apenas um</li>
            </ul>
            
            <div class="additional-rules">
                <h4>Regras Adicionais</h4>
                <div class="rule-option">
                    <input type="checkbox" id="regra1">
                    <label for="regra1">Elementos ficam mais rápidos ao vencer</label>
                </div>
                <div class="rule-option">
                    <input type="checkbox" id="regra2">
                    <label for="regra2">Elementos ficam maiores ao vencer</label>
                </div>
                <div class="rule-option">
                    <input type="checkbox" id="regra3">
                    <label for="regra3">Elementos ficam mais fortes ao vencer</label>
                </div>
            </div>
        </div>
    </div>

    <div id="div_config" class="panel">
        <button id="fechar_panel" class="fechar_panel">x</button>
        <div class="config-content">
            <h3>Configurações</h3>
            <p class="subtitulo">Aperte executar ou Enter para aplicar</p>
            <div class="configs-individual">
                <label for="config_velocidade">Velocidade Base:</label><input type="number" id="config_velocidade" placeholder="Velocidade" class="configs" value="2.5" step="0.1">
            </div>
            <div class="configs-individual">
                <label for="config_tamanho">Tamanho Base:</label><input type="number" id="config_tamanho" placeholder="Tamanho" class="configs" value="20" step="1">
            </div>
            <div class="configs-individual">
                <label for="config_debug">Modo Debug:</label><input type="checkbox" id="config_debug">
            </div>
            <div class="configs-individual">
                <label for="config_marcacao">Mostrar elemento número:</label><input type="number" id="config_marcacao" placeholder="Número do Elemento" class="configs" step="1">
            </div>
            <div class="configs-individual">
                <label for="config_nome">Mostrar nome:</label><input type="checkbox" id="config_nome">
            </div>
        </div>
    </div>

    <script>

        function loadSettings() {
            document.querySelectorAll('input[type="checkbox"], input[type="number"]').forEach(input => {
                const saved = localStorage.getItem(input.id);
                if (saved !== null) {
                    if (input.type === 'checkbox') {
                        input.checked = saved === 'true';
                    } else {
                        input.value = saved;
                    }
                }
            });
        }
        function saveSettings() {
            document.querySelectorAll('input[type="checkbox"], input[type="number"]').forEach(input => {
                localStorage.setItem(input.id, input.type === 'checkbox' ? input.checked : input.value);
            });
        }
        document.addEventListener('change', (e) => {
            if (e.target.matches('input[type="checkbox"], input[type="number"]')) {
                saveSettings();
            }
        });
        loadSettings();
        
        const body = document.body;
        const stopButton = document.getElementById('stop');
        const resetButton = document.getElementById('reset');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.canvas.width  = window.innerWidth;
        ctx.canvas.height = window.innerHeight;
        const adicionarButton = document.getElementById('adicionar');
        const quantidadeInput = document.getElementById('quantidade');
        const regrasButton = document.getElementById('regras');
        const configButton = document.getElementById('config');
        const regra1Checkbox = document.getElementById('regra1');
        const regra2Checkbox = document.getElementById('regra2');
        const regra3Checkbox = document.getElementById('regra3');
        const divConfig = document.getElementById('div_config');
        const divRegras = document.getElementById('div_regras');
        const fecharPanels = document.querySelectorAll('.fechar_panel');
        const configVelocidadeInput = document.getElementById('config_velocidade');
        const configTamanhoInput = document.getElementById('config_tamanho');
        const configDebugCheckbox = document.getElementById('config_debug');
        const configMarcacaoInput = document.getElementById('config_marcacao');
        const configNomeCheckbox = document.getElementById('config_nome');

        let interval;
        let pausado = false;
        let elements = [];

        adicionarButton.addEventListener('click', () => {
            adicionarElementos();
        });
        quantidadeInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                adicionarElementos();
            }
            if (event.key === ' ') {
                event.preventDefault();
                togglePause();
            }
        });
        body.addEventListener('keydown', function(event) {
            if (event.target.tagName === 'INPUT') return;
            
            if (event.key === 'Enter') {
                event.preventDefault();
                adicionarElementos();
            }
            if (event.key === ' ') {
                event.preventDefault();
                togglePause();
            }
        });
        regrasButton.addEventListener('click', () => {
            if (divConfig.classList.contains('open')) {
                divConfig.classList.remove('open');
            }
            divRegras.classList.toggle('open');
        });
        configButton.addEventListener('click', () => {
            if (divRegras.classList.contains('open')) {
                divRegras.classList.remove('open');
            }
            divConfig.classList.toggle('open');
        });
        stopButton.addEventListener('click', () => {
            togglePause();
        });
        resetButton.addEventListener('click', () => {
            elements = [];
        });
        fecharPanels.forEach(button => {
            button.addEventListener('click', () => {
                button.parentElement.classList.remove('open');
            });
        });


        function adicionarElementos() {
        const quantidade = parseInt(quantidadeInput.value);
            if (elements.length !== 0) {
                elements = [];
            }
            clearInterval(interval);
            
            if (configDebugCheckbox.checked) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(canvas.width, canvas.height) * 0.4;
                
                for (let i = 0; i < quantidade; i++) {
                    const angle = (i / quantidade) * Math.PI * 2;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    const angleToCenter = Math.atan2(centerY - y, centerX - x) * (180 / Math.PI);
                    const variation = (Math.random() - 0.5) * 60;
                    
                    const elemento = {
                        id: elements.length + 1,
                        name: `Elemento ${elements.length + 1}`,
                        center: { x, y },
                        raio: parseFloat(configTamanhoInput.value),
                        angulo: angleToCenter + variation,
                        velocidade: parseFloat(configVelocidadeInput.value),
                        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                        forca: 0
                    };
                    elements.push(elemento);
                }
            } else {
                for (let i = 0; i < quantidade; i++) {
                    const elemento = {
                        id: elements.length + 1,
                        name: `Elemento ${elements.length + 1}`,
                        center: {
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height
                        },
                        raio: parseFloat(configTamanhoInput.value),
                        angulo: Math.random() * 360,
                        velocidade: parseFloat(configVelocidadeInput.value),
                        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                        forca: 0
                    };
                    elements.push(elemento);
                }
            }
            
            draw();
            if (!pausado) {
                interval = setInterval(draw, 1000 / 60);
            }
        }
        function interagir(element1, element2) {
            let dado1 = (Math.floor(Math.random() * 100) + 1) + (element1.forca);
            let dado2 = (Math.floor(Math.random() * 100) + 1) + (element2.forca);

            if (dado1 > dado2) {
                let dx = element1.center.x - element2.center.x;
                let dy = element1.center.y - element2.center.y;
                element1.angulo = Math.atan2(dy, dx) * (180 / Math.PI);
                
                elements = elements.filter(e => e !== element2);
                if (regra1Checkbox.checked) {
                    element1.velocidade += 0.5;
                }
                if (regra2Checkbox.checked) {
                    element1.raio += 2;
                }
                if (regra3Checkbox.checked) {
                    element1.forca = (element1.forca || 0) + 2;
                }

            } else if (dado2 > dado1) {
                let dx = element2.center.x - element1.center.x;
                let dy = element2.center.y - element1.center.y;
                element2.angulo = Math.atan2(dy, dx) * (180 / Math.PI);
                
                elements = elements.filter(e => e !== element1);
                if (regra1Checkbox.checked) {
                    element2.velocidade += 0.5;
                }
                if (regra2Checkbox.checked) {
                    element2.raio += 5;
                }
                if (regra3Checkbox.checked) {
                    element2.forca = (element2.forca || 0) + 2;
                }
            }
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            elements.forEach(element => {
                ctx.fillStyle = element.color;
                ctx.strokeStyle = "white";
                ctx.beginPath();
                ctx.arc(element.center.x, element.center.y, element.raio, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.closePath();
                ctx.lineWidth = 5;

                if (configNomeCheckbox.checked) {
                    ctx.beginPath();
                    ctx.moveTo(element.center.x, element.center.y);
                    ctx.font = "18px Arial";
                    ctx.fillStyle = "white";
                    ctx.fillText(element.name, element.center.x - element.raio - 20, element.center.y - element.raio - 10);
                    ctx.closePath();
                }

                if (regra3Checkbox.checked) {
                    ctx.beginPath();
                    ctx.moveTo(element.center.x, element.center.y);
                    ctx.font = "14px Arial";
                    ctx.fillStyle = "white";
                    ctx.fillText(`Força: ${element.forca}`, element.center.x - element.raio - 5, element.center.y + element.raio + 20);
                    ctx.closePath();
                }
                if (configMarcacaoInput.value && parseInt(configMarcacaoInput.value) === element.id) {
                    ctx.beginPath();
                    ctx.strokeStyle = "red";
                    ctx.fillStyle = "red";
                    ctx.moveTo(element.center.x, element.center.y + element.raio - 90);
                    ctx.lineTo(element.center.x + 20, element.center.y + element.raio - 110);
                    ctx.lineTo(element.center.x - 20, element.center.y + element.raio - 110);
                    ctx.closePath();
                    ctx.fill();
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }
                
                let anguloRad = element.angulo * (Math.PI / 180);
                element.velocidadex = Math.cos(anguloRad) * element.velocidade;
                element.velocidadey = Math.sin(anguloRad) * element.velocidade;
                element.center.x += element.velocidadex;
                element.center.y += element.velocidadey;

                if (element.center.x >= canvas.width - element.raio) {
                    element.center.x = canvas.width - element.raio;
                    element.angulo = 180 - element.angulo;
                }
                if (element.center.x <= element.raio) {
                    element.center.x = element.raio;
                    element.angulo = 180 - element.angulo;
                }
                if (element.center.y >= canvas.height - element.raio) {
                    element.center.y = canvas.height - element.raio;
                    element.angulo = -element.angulo;
                }
                if (element.center.y <= element.raio) {
                    element.center.y = element.raio;
                    element.angulo = -element.angulo;
                }
                let elementosproximos = [];
                for (let j = 0; j < elements.length; j++) {
                    let elementopossivel = elements[j];
                    if (elementopossivel === element) continue;
                    const dx = element.center.x - elementopossivel.center.x;
                    const dy = element.center.y - elementopossivel.center.y;
                    elementosproximos.push({x: dx, y: dy, elemento: elementopossivel});
                    if (elementosproximos.length === elements.length - 1) {
                        for (let k = 0; k <= elements.length - 1; k++) {
                            if (elements[k] === element) continue;
                            const distancia = Math.sqrt((element.center.x - elements[k].center.x) ** 2 + (element.center.y - elements[k].center.y) ** 2);
                            if (distancia <= element.raio + elements[k].raio) {
                                interagir(element, elements[k]);
                            }
                        }
                    }
                }
            });
            
        }
        function togglePause() {
            pausado = !pausado;
            if (pausado) {
                clearInterval(interval);
                stopButton.textContent = 'Continuar';
            } else {
                interval = setInterval(draw, 1000 / 60);
                stopButton.textContent = 'Pausar';
            }
        }
        if (elements.length === 1) {
            clearInterval(interval);
        }

    </script>
</body>
</html>
